[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-training-studio"
version = "1.0.0"
description = "Professional YOLO Training Studio with modern UI for dataset management, labeling, and model training"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "YOLO Training Studio Team"}
]
keywords = ["yolo", "object-detection", "machine-learning", "computer-vision", "training"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "ultralytics>=8.3.0",
    "torch>=2.0.0",
    "gradio>=4.44.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.0",
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
roboflow = ["roboflow>=1.1.0"]
export = ["onnx>=1.14.0", "onnxruntime>=1.16.0"]
dev = ["pytest>=7.4.0", "black>=23.0.0"]
all = ["yolo-training-studio[roboflow,export,dev]"]

[project.scripts]
yolo-studio = "src.app:main"

[project.urls]
Homepage = "https://github.com/yolo-training-studio"
Documentation = "https://github.com/yolo-training-studio/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
